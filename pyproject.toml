[project]
name = "leah"
version = "0.1.0"
description = "Leah — AI personal assistant powered by Claude"
requires-python = ">=3.12"
dependencies = [
    # Anthropic SDK
    "anthropic>=0.40.0",
    # Google APIs
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.155.0",
    # Config / env
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # CLI
    "rich>=13.9.0",
    "prompt_toolkit>=3.0.48",
]

[project.scripts]
leah = "leah.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
